# ============================================================================
#  Panda Fit - Gradle: configuracion global del proyecto
# ============================================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# La cache de configuracion se desactiva a proposito: los plugins de Firebase
# y KSP son mas estables sin ella en proyectos nuevos.
org.gradle.configuration-cache=false

# AndroidX (obligatorio en proyectos modernos)
android.useAndroidX=true
# R class por modulo (builds mas rapidos y limpios)
android.nonTransitiveRClass=true
# Compose: evita conflictos de recursos al usar BOM
android.enableJetifier=false

kotlin.code.style=official
